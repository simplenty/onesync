[package]
name = "OneSync"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_7", "gtk_v4_18"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
